name: Trade Levels cron pinger

# Lightweight REDUNDANT backup for the app's own in-process scheduler. The app runs
# on an always-on deployment (100% uptime), so its internal cron already generates
# levels (~5:15pm ET), scores results (~5pm ET), and runs intraday alerts (every 2
# min). This workflow only re-triggers the two DAILY jobs as belt-and-suspenders.
#
# The every-5-min intraday ping was REMOVED because it burned through the free
# GitHub Actions minutes (the internal 2-min loop already covers intraday). If the
# deployment is ever switched to Autoscale (which sleeps), restore an intraday ping
# via a free external cron instead: https://tradelevelspro.com/api/cron/intraday?key=YOUR_KEY
#
# SETUP (one time): add a repo secret CRON_KEY = the value of ALGORITHM_INGEST_API_KEY.

on:
  schedule:
    - cron: "3 21 * * 1-5" # results ~5:03pm ET (EDT)
    - cron: "3 22 * * 1-5" # results ~5:03pm ET (EST)
    - cron: "17 21 * * 1-5" # generate next-session levels ~5:17pm ET (EDT)
    - cron: "17 22 * * 1-5" # generate next-session levels ~5:17pm ET (EST)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger job
        env:
          KEY: ${{ secrets.CRON_KEY }}
          SCHED: ${{ github.event.schedule }}
        run: |
          case "$SCHED" in
            "17 21 * * 1-5"|"17 22 * * 1-5") JOB=generate ;;
            "3 21 * * 1-5"|"3 22 * * 1-5") JOB=results ;;
            *) JOB=intraday ;;
          esac
          echo "Triggering $JOB"
          curl -sS -m 90 "https://tradelevelspro.com/api/cron/$JOB?key=$KEY" || true
